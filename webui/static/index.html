<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>heos-ui</title>
<style>
  :root {
    --bg: #fafaf8;
    --surface: #f1f0ec;
    --line: #e4e2dc;
    --text: #1c1b19;
    --muted: #67635c;
    /* One ink: amber, like the standby LED on a piece of hi-fi. It marks what
       is live — the position, the speaker you are driving, the playing state —
       and nothing else. */
    --accent: #a8530a;
    --danger: #b42318;
    --radius: 10px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --surface: #1e1d1b;
      --line: #2c2b28;
      --text: #edebe6;
      --muted: #a29e96;
      --accent: #f0a43c;
      --danger: #f97066;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: max(20px, env(safe-area-inset-top)) 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    caret-color: var(--accent);
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .wrap { max-width: 600px; margin: 0 auto; }

  /* -- type: four sizes, three weights ----------------------------------- */
  h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 15px; }
  h2 { font-size: 15px; }
  .meta, .hint, .empty, .tag, .times, .num { font-size: 13px; color: var(--muted); }
  code { font-size: 13px; }

  /* -- icons ------------------------------------------------------------- */
  .i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none;
       stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* -- controls ---------------------------------------------------------- */
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
  }
  button:hover { background: var(--surface); }
  button:active { background: var(--line); }
  button:disabled { color: var(--muted); background: transparent; cursor: default; opacity: .6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .primary:hover { background: color-mix(in srgb, var(--text) 86%, var(--bg)); }
  .primary:disabled { background: var(--text); color: var(--bg); }
  .ghost { border-color: transparent; }
  .icon { border-color: transparent; padding: 0; width: 40px; height: 40px; color: var(--muted); }
  .icon:hover { color: var(--text); }
  .icon.on { color: var(--danger); }

  input[type=text], input[type=email], input[type=password] {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid transparent; border-radius: var(--radius);
    padding: 9px 12px;
    transition: border-color .15s var(--ease), background-color .15s var(--ease);
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus {
    outline: none; border-color: var(--accent); background: var(--bg);
  }
  input[type=range] { flex: 1; min-width: 0; margin: 0; height: 28px; accent-color: var(--accent); cursor: pointer; }

  /* -- header ------------------------------------------------------------ */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dot.live { background: var(--accent); }

  /* -- sections: separated by space and one hairline, not boxes ---------- */
  section, details { border-top: 1px solid var(--line); padding: 28px 0; }
  section.now { border-top: 0; padding-top: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  /* A ghost button's padding is invisible, so the last one sits on the edge. */
  .head .ghost:last-child { margin-right: -14px; }

  /* -- now playing ------------------------------------------------------- */
  .np { display: grid; grid-template-columns: 112px 1fr; gap: 20px; align-items: center; }
  .art {
    width: 112px; height: 112px; border-radius: var(--radius); object-fit: cover;
    background: var(--surface); display: grid; place-items: center; color: var(--muted);
  }
  .art .i { width: 32px; height: 32px; stroke-width: 1.5; }
  .title { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em;
           margin: 0 0 4px; overflow-wrap: anywhere; text-wrap: balance; }
  .artist { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .where { margin: 8px 0 0; }

  /* The bar is 4px to the eye and 24px to a finger: the padding is the hit
     area, and background-clip keeps it invisible. */
  .bar { height: 24px; padding: 10px 0; margin: 24px 0 4px; background: var(--surface); background-clip: content-box;
         border-radius: 99px; cursor: pointer; touch-action: none; overflow: hidden; transition: padding .15s var(--ease); }
  .bar:hover, .bar.seeking { padding: 9px 0; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 99px;
             transition: width .9s linear; }
  /* While dragging, the fill has to track the finger with no easing at all. */
  .bar.seeking > i { transition: none; }
  /* Our own estimate rather than the speaker's report: the same ink, thinner. */
  .bar > i.est { opacity: .55; }
  .times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
  .controls .icon { width: 48px; height: 48px; color: var(--text); }
  .controls .icon .i { width: 22px; height: 22px; }
  .play { width: 60px; height: 60px; border-radius: 50%; padding: 0; }
  .play .i { width: 24px; height: 24px; }
  .t-fill { fill: currentColor; }

  .master { display: flex; align-items: center; gap: 8px; margin: 20px 0 0 -10px; }
  .num { min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

  /* -- play a link ------------------------------------------------------- */
  form.link { display: flex; gap: 8px; }
  .hint { margin: 10px 0 0; }
  .msg { margin: 12px 0 0; font-size: 13px; overflow-wrap: anywhere; display: none; }
  .msg.ok, .msg.err { display: flex; gap: 8px; align-items: flex-start; }
  .msg.ok { color: var(--muted); }
  .msg.err { color: var(--danger); }
  .msg .i { width: 16px; height: 16px; margin-top: 2px; }
  .msg > div { min-width: 0; }
  .tracks { margin: 8px 0 0; padding-left: 20px; max-height: 168px; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  /* -- speakers ---------------------------------------------------------- */
  .spk { display: grid; gap: 4px; }
  .spk-row { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: center;
             padding: 10px 8px; margin: 0 -8px; border-radius: var(--radius); }
  .spk-row.target { background: var(--surface); }
  .pick { border: 0; padding: 0; background: none; font-weight: 500; text-align: left;
          justify-content: flex-start; gap: 10px; min-height: 32px; }
  .pick:hover { background: none; color: var(--accent); }
  .pick .mark { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
  .spk-row.target .pick .mark { background: var(--accent); border-color: var(--accent); }
  .tags { display: flex; gap: 10px; }
  .tag.on { color: var(--accent); }
  .vol { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-left: -10px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* -- playlists --------------------------------------------------------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { border-radius: 99px; padding: 5px 12px; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .n { opacity: .7; font-variant-numeric: tabular-nums; }
  .empty { margin: 0; }
  .items { display: grid; margin: 0 -8px; }
  .item { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 8px; align-items: center;
          padding: 4px 0 4px 8px; border-radius: 8px; }
  .item:hover { background: var(--surface); }
  .item .icon { width: 32px; height: 32px; }
  .item .icon .i { width: 16px; height: 16px; }
  .pos { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .len { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .acts { display: flex; }
  .total { margin: 12px 0 16px; }

  /* -- account: rarely needed, so folded away ---------------------------- */
  summary { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            cursor: pointer; list-style: none; border-radius: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary h2::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 10px;
                      border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                      transform: translateY(-3px) rotate(45deg); transition: transform .15s var(--ease); }
  details[open] summary h2::after { transform: translateY(0) rotate(-135deg); }
  .acct-body { margin-top: 16px; display: grid; gap: 12px; }
  .acct-form { display: grid; gap: 12px; margin: 0; }
  .acct-form .pair { display: flex; gap: 8px; flex-wrap: wrap; }
  .acct-form input { min-width: 180px; }
  .srcs { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .srcs:empty { display: none; }
  .src { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .src.on { color: var(--text); }
  .src .i { width: 14px; height: 14px; color: var(--accent); }

  @media (max-width: 460px) {
    .np { grid-template-columns: 80px 1fr; gap: 16px; }
    .art { width: 80px; height: 80px; }
    .title { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path class="t-fill" d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path class="t-fill" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path class="t-fill" d="M18 6.5v11L10 12z"/><path d="M6.5 6v12"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path class="t-fill" d="M6 6.5v11l8-5.5z"/><path d="M17.5 6v12"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path class="t-fill" d="M7 7h10v10H7z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4z"/><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 6v12L7 14.5H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
</svg>

<div class="wrap">

  <header class="top">
    <h1>heos-ui</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span>
  </header>

  <section class="now" aria-label="Now playing">
    <div class="np">
      <div class="art" id="art"><svg class="i"><use href="#i-note"/></svg></div>
      <div>
        <p class="title" id="title">Nothing playing</p>
        <p class="artist" id="artist"></p>
        <p class="meta where" id="where"></p>
      </div>
    </div>
    <div class="bar" id="bar" title="Drag to move within the track"><i id="fill"></i></div>
    <div class="times">
      <span id="pos">0:00</span>
      <span id="remain"></span>
      <span id="dur"></span>
    </div>
    <div class="controls">
      <button class="icon" id="prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="primary play" id="toggle" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon" id="next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon" id="stop" aria-label="Stop"><svg class="i"><use href="#i-stop"/></svg></button>
    </div>
    <div class="master">
      <button class="icon" id="mute" aria-label="Mute" aria-pressed="false"><svg class="i"><use href="#i-vol"/></svg></button>
      <input type="range" id="masterVol" min="0" max="100" value="0" aria-label="Volume">
      <span class="num" id="masterNum">—</span>
    </div>
  </section>

  <section aria-labelledby="h-link">
    <div class="head"><h2 id="h-link">Play a link</h2></div>
    <form class="link" id="form">
      <input type="text" id="url" placeholder="Paste a link" aria-label="Link to play" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit" id="go">Play</button>
      <button type="button" id="save" aria-label="Add to the open playlist" title="Add to the open playlist"><svg class="i"><use href="#i-plus"/></svg></button>
    </form>
    <p class="hint">Single tracks only: sets and playlists can't be played yet.</p>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <section aria-labelledby="h-spk">
    <div class="head">
      <h2 id="h-spk">Speakers</h2>
      <div class="row-actions">
        <button class="ghost" id="groupAll" disabled>Group all</button>
        <button class="ghost" id="ungroup" disabled>Ungroup</button>
      </div>
    </div>
    <div class="spk" id="spk"></div>
  </section>

  <section aria-labelledby="h-pl">
    <div class="head">
      <h2 id="h-pl">Playlists</h2>
      <button class="ghost" id="newList"><svg class="i"><use href="#i-plus"/></svg>New</button>
    </div>
    <div class="tabs" id="plTabs"></div>
    <div id="plBody"></div>
  </section>

  <details id="acct">
    <summary><h2>HEOS account</h2><span class="meta" id="acctState">…</span></summary>
    <div class="acct-body">
      <div id="acctBody"></div>
      <div class="srcs" id="srcs"></div>
      <div class="msg" id="acctMsg" role="status" aria-live="polite"></div>
    </div>
  </details>

</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let busyVolume = 0;      // ignore polled values right after a drag
let seekDrag = null;     // {duration} while the progress bar is being dragged
let busySeek = 0;        // the speaker takes a moment to report the new position
let pending = false;

const fmt = (ms) => {
  if (!ms && ms !== 0) return "";
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
           : `${m}:${String(sec).padStart(2,"0")}`;
};

const icon = (name) => `<svg class="i"><use href="#i-${name}"/></svg>`;

function iconButton(name, label, onClick) {
  const b = document.createElement("button");
  b.className = "icon";
  b.innerHTML = icon(name);
  b.setAttribute("aria-label", label);
  b.title = label;
  b.addEventListener("click", onClick);
  return b;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function renderNow(now, target) {
  const playing = now.song || now.artist;
  // For a URL stream the firmware only knows the literal "Url Stream", so show
  // the real title we resolved when starting playback.
  const title = (now.is_url_stream && now.known_title) ? now.known_title : now.song;
  const artist = (now.is_url_stream) ? (now.known_artist || "") : (now.artist || "");
  $("title").textContent = title || "Nothing playing";
  $("artist").textContent = artist;
  $("where").textContent = target ? `on ${target.label}` : "";

  // The firmware sends no artwork for a URL stream; use the one we resolved.
  const image = now.image || (now.is_url_stream ? now.known_image : null);
  const art = $("art");
  if (image) {
    if (art.tagName !== "IMG") {
      const img = document.createElement("img");
      img.className = "art"; img.id = "art"; img.alt = "";
      art.replaceWith(img);
    }
    if ($("art").src !== image) $("art").src = image;
  } else if (art.tagName === "IMG") {
    const div = document.createElement("div");
    div.className = "art"; div.id = "art"; div.innerHTML = icon("note");
    art.replaceWith(div);
  }

  if (now.duration) {
    $("dur").textContent = fmt(now.duration);
    // While dragging — and briefly after, until the speaker reports the new
    // position — the polled value is stale and would yank the bar backwards.
    if (!seekDrag && Date.now() - busySeek > 2000) {
      const pct = Math.min(100, (now.position || 0) / now.duration * 100);
      $("fill").style.width = `${pct}%`;
      $("fill").classList.toggle("est", !!now.estimated);
      // The speaker cannot time a URL stream, so that position is our estimate.
      $("pos").textContent = fmt(now.position || 0) + (now.estimated ? " ~" : "");
      $("remain").textContent = "-" + fmt(now.duration - (now.position || 0));
    }
  } else {
    // Nothing we started and nothing the firmware can time.
    $("fill").style.width = playing ? "100%" : "0%";
    $("fill").classList.remove("est");
    $("dur").textContent = "";
    $("remain").textContent = "";
    $("pos").textContent = playing ? "Live stream" : "";
  }
}

function setMute(button, muted) {
  button.innerHTML = icon(muted ? "muted" : "vol");
  button.classList.toggle("on", !!muted);
  button.setAttribute("aria-pressed", muted ? "true" : "false");
  button.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  button.title = muted ? "Unmute" : "Mute";
}

function renderMaster(target) {
  if (!target) return;
  const slider = $("masterVol");
  const num = $("masterNum");
  // Do not fight the user while they are dragging.
  if (Date.now() - busyVolume > 1500 && target.volume !== null) {
    slider.value = target.volume;
    num.textContent = target.volume;
  }
  setMute($("mute"), target.muted);
}

function renderSpeakers(players, target) {
  const box = $("spk");
  box.innerHTML = "";
  if (!players.length) {
    box.innerHTML = `<p class="empty">No speakers answered. Check that they are on and on this network.</p>`;
    return;
  }
  for (const p of players) {
    const row = document.createElement("div");
    row.className = "spk-row";
    // With several ungrouped speakers there is no default, so the row is how
    // you say which one the controls act on.
    const isTarget = target && !target.is_group && target.id === p.id;
    if (isTarget) row.classList.add("target");

    const name = document.createElement("button");
    name.className = "pick";
    name.setAttribute("aria-pressed", isTarget ? "true" : "false");
    name.innerHTML = `<span class="mark"></span>`;
    name.append(p.name);
    name.title = isTarget && target.pinned
      ? "Playing here — click to go back to choosing automatically"
      : "Play here";
    name.addEventListener("click", async () => {
      try {
        // Clicking the pinned speaker again releases it.
        const pin = isTarget && target.pinned ? null : String(p.id);
        await api("/api/target", {player: pin});
        flash(pin ? `Playing on ${p.name}` : "Choosing the speaker automatically", false);
      } catch (e) { flash(e.message, true); }
      refresh();
    });

    const tags = document.createElement("span");
    tags.className = "tags";
    if (p.group) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = p.is_leader ? `${p.group} · leader` : p.group;
      tags.appendChild(tag);
    }
    const st = document.createElement("span");
    st.className = "tag" + (p.state === "play" ? " on" : "");
    st.textContent = {play: "Playing", pause: "Paused", stop: "Stopped"}[p.state] || p.state;
    tags.appendChild(st);

    const vol = document.createElement("div");
    vol.className = "vol";
    const slider = document.createElement("input");
    slider.type = "range"; slider.min = 0; slider.max = 100; slider.value = p.volume;
    slider.setAttribute("aria-label", `${p.name} volume`);
    const num = document.createElement("span");
    num.className = "num"; num.textContent = p.volume;
    slider.addEventListener("input", () => { num.textContent = slider.value; busyVolume = Date.now(); });
    slider.addEventListener("change", async () => {
      busyVolume = Date.now();
      try { await api("/api/volume", {player: String(p.id), level: Number(slider.value)}); }
      catch (e) { flash(e.message, true); }
    });
    const rowMute = iconButton("vol", "Mute", async () => {
      try { await api("/api/mute", {player: String(p.id), state: "toggle"}); }
      catch (e) { flash(e.message, true); }
      refresh();
    });
    setMute(rowMute, p.muted);

    vol.append(rowMute, slider, num);
    row.append(name, tags, vol);
    box.appendChild(row);
  }
}

function showMessage(el, text, isError) {
  el.className = "msg " + (isError ? "err" : "ok");
  el.innerHTML = isError ? icon("alert") : "";
  const body = document.createElement("div");
  body.textContent = text;
  el.appendChild(body);
  return body;
}

function flash(text, isError) { return showMessage($("msg"), text, isError); }

async function refresh() {
  try {
    const data = await api("/api/state");
    state = data;
    $("dot").className = "dot live";
    $("conn").textContent = "Connected";
    // No speaker to show: nothing playing, and the speaker list says why.
    renderNow(data.now || {}, data.target);
    renderMaster(data.target);
    // Skip re-rendering sliders while the user is dragging one.
    if (Date.now() - busyVolume > 1500) renderSpeakers(data.players, data.target);
    const playing = data.players.some(p => p.state === "play");
    $("toggle").innerHTML = icon(playing ? "pause" : "play");
    $("toggle").setAttribute("aria-label", playing ? "Pause" : "Play");
    $("groupAll").disabled = data.players.length < 2;
    $("ungroup").disabled = !data.groups.length;
  } catch (e) {
    $("dot").className = "dot";
    $("conn").textContent = "Disconnected";
  }
}

// The master control acts on the group when there is one, so no player is named.
$("masterVol").addEventListener("input", () => {
  busyVolume = Date.now();
  $("masterNum").textContent = $("masterVol").value;
});
$("masterVol").addEventListener("change", async () => {
  busyVolume = Date.now();
  try { await api("/api/volume", {level: Number($("masterVol").value)}); }
  catch (e) { flash(e.message, true); }
});
$("mute").addEventListener("click", async () => {
  try { await api("/api/mute", {state: "toggle"}); } catch (e) { flash(e.message, true); }
  refresh();
});

$("toggle").addEventListener("click", async () => {
  const playing = state && state.players.some(p => p.state === "play");
  await api("/api/transport", {action: playing ? "pause" : "play"}).catch(e => flash(e.message, true));
  refresh();
});
for (const [id, action] of [["prev","prev"], ["next","next"], ["stop","stop"]]) {
  $(id).addEventListener("click", async () => {
    await api("/api/transport", {action}).catch(e => flash(e.message, true));
    refresh();
  });
}

// Dragging the progress bar to move within the track. The HEOS protocol has no
// seek command at all, so this goes out over the speaker's UPnP renderer, which
// does advertise one. Pointer events rather than mouse ones: the page is meant
// to work from a phone.
function seekFraction(ev) {
  const box = $("bar").getBoundingClientRect();
  return Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width));
}

function previewSeek(ev) {
  if (!seekDrag) return;
  const at = seekFraction(ev);
  $("fill").style.width = `${at * 100}%`;
  $("pos").textContent = fmt(at * seekDrag.duration);
  $("remain").textContent = "-" + fmt(seekDrag.duration * (1 - at));
}

function endSeekDrag() {
  seekDrag = null;
  $("bar").classList.remove("seeking");
}

$("bar").addEventListener("pointerdown", (ev) => {
  const duration = state && state.now ? state.now.duration : null;
  // A live stream has no length, so there is nowhere to seek to.
  if (!duration) return;
  seekDrag = {duration};
  $("bar").classList.add("seeking");
  $("bar").setPointerCapture(ev.pointerId);
  previewSeek(ev);
});

$("bar").addEventListener("pointermove", previewSeek);

$("bar").addEventListener("pointerup", async (ev) => {
  if (!seekDrag) return;
  const position = Math.round(seekFraction(ev) * seekDrag.duration);
  endSeekDrag();
  busySeek = Date.now();
  try {
    await api("/api/seek", {position});
    flash(`Moved to ${fmt(position)}`, false);
  } catch (e) {
    // Most likely the speaker is playing something it will not seek within.
    busySeek = 0;
    flash(e.message, true);
  }
  refresh();
});

$("bar").addEventListener("pointercancel", endSeekDrag);

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const url = $("url").value.trim();
  if (!url || pending) return;
  pending = true;
  $("go").disabled = true;
  $("go").textContent = "…";
  flash("Resolving…", false);
  try {
    const res = await api("/api/play", {url});
    const text = `${res.title}${res.artist ? " — " + res.artist : ""} → ${res.target} (${res.detail})`;
    const body = flash(text, false);
    if (res.tracks && res.tracks.length) {
      const ol = document.createElement("ol");
      ol.className = "tracks";
      for (const t of res.tracks) { const li = document.createElement("li"); li.textContent = t; ol.appendChild(li); }
      body.appendChild(ol);
    }
    $("url").value = "";
  } catch (e) {
    flash(e.message, true);
  } finally {
    pending = false;
    $("go").disabled = false;
    $("go").textContent = "Play";
    refresh();
  }
});

$("groupAll").addEventListener("click", async () => {
  if (!state || state.players.length < 2) return;
  const ids = state.players.map(p => p.id);
  await api("/api/group", {action: "create", players: ids}).catch(e => flash(e.message, true));
  refresh();
});
$("ungroup").addEventListener("click", async () => {
  await api("/api/group", {action: "ungroup"}).catch(e => flash(e.message, true));
  refresh();
});


// ----------------------------------------------------------------- playlists
let playlists = [];
let selected = null;   // name of the open playlist

function renderPlaylists() {
  const tabs = $("plTabs");
  tabs.innerHTML = "";
  for (const pl of playlists) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.setAttribute("aria-pressed", pl.name === selected ? "true" : "false");
    chip.textContent = pl.name + " ";
    const n = document.createElement("span");
    n.className = "n"; n.textContent = pl.items.length;
    chip.appendChild(n);
    chip.addEventListener("click", () => {
      selected = (selected === pl.name) ? null : pl.name;
      renderPlaylists();
    });
    tabs.appendChild(chip);
  }
  tabs.hidden = !playlists.length;

  const body = $("plBody");
  body.innerHTML = "";
  if (!playlists.length) {
    body.innerHTML = `<p class="empty">No playlists yet. Create one, then add links to it with the + next to Play.</p>`;
    return;
  }
  const pl = playlists.find(p => p.name === selected);
  if (!pl) {
    body.innerHTML = `<p class="empty">Pick a playlist to see its tracks.</p>`;
    return;
  }

  if (!pl.items.length) {
    body.innerHTML = `<p class="empty">Empty. Paste a link above and press +.</p>`;
  } else {
    const list = document.createElement("div");
    list.className = "items";
    pl.items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item";

      const num = document.createElement("span");
      num.className = "pos"; num.textContent = index + 1;

      const title = document.createElement("div");
      title.className = "name";
      title.textContent = item.title;
      if (item.artist) {
        const small = document.createElement("small");
        small.textContent = item.artist;
        title.appendChild(small);
      }

      const len = document.createElement("span");
      len.className = "len";
      len.textContent = item.duration ? fmt(item.duration * 1000) : "";

      const actions = document.createElement("span");
      actions.className = "acts";
      const up = iconButton("up", "Move up", () => move(pl.name, index, index - 1));
      up.disabled = index === 0;
      const down = iconButton("down", "Move down", () => move(pl.name, index, index + 1));
      down.disabled = index === pl.items.length - 1;
      actions.append(up, down, iconButton("x", "Remove", () => removeItem(pl.name, index)));

      row.append(num, title, len, actions);
      list.appendChild(row);
    });
    body.appendChild(list);

    const total = document.createElement("p");
    total.className = "meta total";
    total.textContent = `${pl.items.length} tracks · ${fmt(pl.duration * 1000)}`;
    body.appendChild(total);
  }

  const actions = document.createElement("div");
  actions.className = "row-actions";
  const play = document.createElement("button");
  play.className = "primary"; play.textContent = "Play";
  play.disabled = !pl.items.length;
  play.addEventListener("click", () => playPlaylist(pl.name));
  const del = document.createElement("button");
  del.className = "ghost";
  del.textContent = "Delete";
  del.addEventListener("click", async () => {
    if (!confirm(`Delete "${pl.name}" and its ${pl.items.length} tracks?`)) return;
    await api("/api/playlists/delete", {name: pl.name}).catch(e => flash(e.message, true));
    selected = null;
    await loadPlaylists();
  });
  actions.append(play, del);
  body.appendChild(actions);
}

async function loadPlaylists() {
  try {
    playlists = (await api("/api/playlists")).playlists;
    if (selected && !playlists.some(p => p.name === selected)) selected = null;
    if (!selected && playlists.length === 1) selected = playlists[0].name;
    renderPlaylists();
  } catch (e) { /* the connection status already says it */ }
}

async function move(name, index, to) {
  if (to < 0) return;
  await api("/api/playlists/move", {name, index, to}).catch(e => flash(e.message, true));
  await loadPlaylists();
}

async function removeItem(name, index) {
  await api("/api/playlists/remove", {name, index}).catch(e => flash(e.message, true));
  await loadPlaylists();
}

async function playPlaylist(name) {
  flash("Queueing…", false);
  try {
    const res = await api("/api/playlists/play", {name});
    flash(`${res.title} → ${res.target} (${res.detail})`, false);
  } catch (e) {
    flash(e.message, true);
  }
  refresh();
}

$("newList").addEventListener("click", async () => {
  const name = prompt("Playlist name");
  if (!name) return;
  try {
    await api("/api/playlists/create", {name});
    selected = name;
    await loadPlaylists();
  } catch (e) { flash(e.message, true); }
});

$("save").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) { flash("Paste a link first.", true); return; }
  if (!selected) { flash("Pick a playlist to add it to.", true); return; }
  $("save").disabled = true;
  flash("Resolving…", false);
  try {
    await api("/api/playlists/add", {name: selected, url});
    flash(`Added to ${selected}.`, false);
    $("url").value = "";
    await loadPlaylists();
  } catch (e) {
    flash(e.message, true);
  } finally {
    $("save").disabled = false;
  }
});


// ------------------------------------------------------------------ account
let account = null;

function renderAccount() {
  const body = $("acctBody");
  const srcs = $("srcs");
  body.innerHTML = "";
  srcs.innerHTML = "";
  if (!account) { $("acctState").textContent = "…"; return; }

  $("acctState").textContent = account.signed_in
    ? `Signed in as ${account.username}`
    : "Not signed in";

  if (account.signed_in) {
    const out = document.createElement("button");
    out.textContent = "Sign out";
    out.addEventListener("click", async () => {
      try {
        account = await api("/api/account/signout", {});
        renderAccount();
        acctFlash("Signed out.", false);
      } catch (e) { acctFlash(e.message, true); }
    });
    body.appendChild(out);
  } else {
    const form = document.createElement("form");
    form.className = "acct-form";
    form.innerHTML = `
      <p class="empty">Sign in with your HEOS account, the same one the HEOS app
      uses, to see which of its streaming services the speakers can play.</p>
      <div class="pair">
        <input type="email" id="acctUser" placeholder="Email" aria-label="HEOS account email" autocomplete="username">
        <input type="password" id="acctPass" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button class="primary" type="submit" id="acctGo">Sign in</button>
      </div>
      <p class="hint">The HEOS protocol sends credentials in clear text over port
      1255, and this page is served over plain HTTP on your network.</p>`;
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const username = $("acctUser").value.trim();
      const password = $("acctPass").value;
      if (!username || !password) { acctFlash("Email and password are both required.", true); return; }
      $("acctGo").disabled = true;
      acctFlash("Signing in…", false);
      try {
        account = await api("/api/account/signin", {username, password});
        renderAccount();
        const on = account.sources.filter(s => s.available).map(s => s.name);
        acctFlash(
          on.length ? `Signed in. Available: ${on.join(", ")}.`
                    : "Signed in, but no streaming source came back available. Link them in the HEOS app.",
          false);
      } catch (e) {
        acctFlash(e.message, true);
      } finally {
        const go = $("acctGo");
        if (go) go.disabled = false;
      }
    });
    body.appendChild(form);
  }

  for (const src of account.sources || []) {
    const chip = document.createElement("span");
    chip.className = "src" + (src.available ? " on" : "");
    if (src.available) chip.innerHTML = icon("check");
    chip.append(src.name);
    chip.title = src.available ? (src.account || "Available") : "Not available";
    srcs.appendChild(chip);
  }
}

function acctFlash(text, isError) { showMessage($("acctMsg"), text, isError); }

async function loadAccount() {
  try {
    account = await api("/api/account");
    renderAccount();
  } catch (e) { /* the connection status already says it */ }
}


// Initial load; the state then refreshes on a timer.
loadAccount();
loadPlaylists();

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
